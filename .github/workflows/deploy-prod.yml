name: Build & publish (GHCR)

# Mismo patrón que bonifapp/ciguacash/ciguainv/sistema-del-sol: CI construye la
# imagen y la publica en GHCR; el servidor de producción solo hace `docker compose
# pull && up -d` contra docker-compose.yml (ver ese archivo) — nunca build local.
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      # ARG DATABASE_URL/AUTH_SECRET del Dockerfile traen defaults de build-time
      # (Prisma solo lee schema.prisma para `generate`, nunca se conecta) — no hace
      # falta pasarlos aquí ni guardarlos como secrets de este workflow.
      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Corre en el runner self-hosted instalado en el propio servidor de producción
    # (ver DEPLOYMENT.md → sección "Despliegue automático") — por eso no hace falta
    # SSH: el job YA se ejecuta en esa máquina. La etiqueta "nexit-prod" (además de
    # "self-hosted") evita que este job caiga en otro runner self-hosted que exista
    # para otro proyecto en la misma cuenta de GitHub.
    runs-on: [self-hosted, nexit-prod]
    steps:
      - name: Asegurar que la red externa dev-network exista
        # docker-compose.prod.yml declara dev-network como "external: true" — Compose
        # nunca la crea sola, solo falla si no existe. Idempotente: no rompe si ya está.
        run: docker network inspect dev-network >/dev/null 2>&1 || docker network create dev-network

      - name: Pull de la imagen nueva y reinicio del contenedor
        # Directorio real en el servidor donde vive el clon del repo con su .env de
        # producción (ver DEPLOYMENT.md → "a) Clonar el repositorio y configurar .env").
        working-directory: /home/heriberto777/apps/nexit
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
